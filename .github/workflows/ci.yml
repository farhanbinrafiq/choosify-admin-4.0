name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
        env:
          NODE_ENV: development
          CATALOG_USE_FIRESTORE: 'false'
          OPERATIONS_USE_FIRESTORE: 'false'
          MESSAGING_MODE: mock
          ALLOW_DEV_LOGIN: 'true'
          ALLOWED_ORIGINS: http://127.0.0.1,http://localhost
          PAYMENT_GATEWAY_MOCK: 'false'
