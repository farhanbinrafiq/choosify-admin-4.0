name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify CI secrets for smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$JWT_ACCESS_SECRET" ] && missing+=("JWT_ACCESS_SECRET")
          [ -z "$JWT_REFRESH_SECRET" ] && missing+=("JWT_REFRESH_SECRET")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Actions secrets for smoke: ${missing[*]}"
            echo "Add these repository secrets (Settings → Secrets and variables → Actions): DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET"
            exit 1
          fi
          echo "Required smoke secrets are present."

      - name: Smoke test
        run: npm run smoke
        env:
          NODE_ENV: development
          CATALOG_USE_FIRESTORE: 'false'
          OPERATIONS_USE_FIRESTORE: 'false'
          MESSAGING_MODE: mock
          ALLOW_DEV_LOGIN: 'true'
          ALLOWED_ORIGINS: http://127.0.0.1,http://localhost
          PAYMENT_GATEWAY_MOCK: 'false'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
